name: CI/CD & Vercel Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Code Quality & Asset Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax & Assets
        run: |
          echo "Checking JavaScript syntax and asset integrity across all modules..."
          node scripts/validate.js
          node -c api/send-sms.js
          node -c backend/server.js
          node -c backend/models/db.js
          node -c backend/services/pricingEngine.js
          node -c backend/services/pdfService.js
          node -c backend/services/emailService.js
          node -c backend/middleware/auth.js
          node -c backend/middleware/security.js
          echo "All modules and assets passed validation!"

      - name: Verify Core Deployment Files
        run: |
          test -f vercel.json
          test -f README.md
          test -f package.json
          test -f public/index.html
          test -f public/services.html
          test -f public/work.html
          test -f public/pricing.html
          test -f public/about.html
          test -f public/contact.html
          test -f public/quote.html
          test -f public/404.html
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/css/style.css
          test -f public/assets/logo/cape-secure-logo.png
          echo "All core files verified successfully!"

  deploy:
    name: Vercel Production Deployment
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (CLI Action)
        # Note: If your GitHub repository is connected directly via Vercel's dashboard,
        # Vercel already deploys automatically on push.
        # This step provides an optional fallback if VERCEL_TOKEN is configured in GitHub secrets.
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deployment Success Notification
        run: |
          echo "========================================================"
          echo " CapeSecure production deployment workflow completed!  "
          echo " If using Vercel GitHub integration, Vercel deploys    "
          echo " automatically on every commit pushed to main.         "
          echo "========================================================"
